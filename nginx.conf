server {
  listen 80;
  server_name omijoy.kro.kr;

  return 301 https://$host$request_uri;
}

# 2) 실제 서비스는 HTTPS로
server {
  listen 443 ssl;
  server_name omijoy.kro.kr;

  # ---- 여기 인증서 경로는 컨테이너 안 기준 ----
  # 호스트: /etc/letsencrypt/live/omijoy.kro.kr
  # 컨테이너: 동일 경로로 볼륨 마운트해야 함
  ssl_certificate     /etc/letsencrypt/live/omijoy.kro.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/omijoy.kro.kr/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;
  index index.html;

  # Cache-bust hashed assets aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Same-origin API entrypoint when VITE_API_BASE_URL=/api
  location /api/ {
    proxy_pass http://backend-app:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Direct API calls without /api prefix (current code hits these)
  location ~ ^/(performances|views|favorite|newsignups|user|auth|oauth2|prfDetails|kopis)(/|$) {
    proxy_pass http://backend-app:8080$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /oauth2/authorization/ {
    proxy_pass http://backend-app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;
  }

  # 콜백 URL: /login/oauth2/code/{registrationId}
  location ^~ /login/oauth2/ {
    proxy_pass http://backend-app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_redirect off;
  }

  location = /oauth2/callback {
  try_files $uri /index.html;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 404 /index.html;
}