server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache-bust hashed assets aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Same-origin API entrypoint when VITE_API_BASE_URL=/api
  location /api {
    proxy_pass http://backend-app:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Direct API calls without /api prefix (current code hits these)
  location ~ ^/(performances|views|favorite|newsignups|user|auth|oauth2|prfDetails)(/|$) {
    proxy_pass http://backend-app:8080$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # KOPIS proxy
  location /kopis/ {
    proxy_pass http://backend-app:4000$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  error_page 404 /index.html;
}

