worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

  # Update these hosts/ports to match your backend services
  upstream backend_api {
    server backend:8080;
  }

  upstream kopis_proxy {
    server kopis-proxy:4000;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache-bust hashed assets aggressively.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Same-origin API entrypoint when VITE_API_BASE_URL=/api
    location /api/ {
      proxy_pass http://backend_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Direct API calls without /api prefix (current code hits these)
    location ~ ^/(performances|views|favorite|newsignups|user|auth|oauth2|prfDetails)(/|$) {
      proxy_pass http://backend_api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # KOPIS proxy
    location /kopis/ {
      proxy_pass http://kopis_proxy$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
  }
}
